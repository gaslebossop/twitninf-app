name: Build iOS Unsigned

# Build iOS non signe sur un runner macOS GitHub, pour contourner
# l'exigence Xcode >= 16.1 de React Native 0.81 que la VM locale
# (Xcode 15.1) ne peut pas satisfaire — et, depuis le passage a
# react-native-nitro-rtmp-publisher, le plancher SDK iOS 26 de HaishinKit
# 2.2.5 (voir le commentaire sur `runs-on` plus bas).
#
# L'artefact produit est un .ipa signe en ad-hoc (aucun certificat Apple
# requis) : le RE-signer ensuite avec Sideloadly ou AltStore (Apple ID
# gratuit) pour l'installer sur un appareil. Voir l'etape « Package IPA »
# pour pourquoi l'ad-hoc n'est pas optionnel.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Un seul build publiant a la fois, et surtout PAS d'annulation du run en cours.
#
# Ce workflow lit `buildVersion` dans le gist au demarrage, grave le numero
# suivant dans le bundle, puis le republie ~15 minutes plus tard. Deux pushes
# rapproches faisaient donc demarrer deux jobs qui lisaient la MEME valeur, et
# le second se faisait rejeter son `git push` sur un clone devenu perime
# (« ! [rejected] main -> main (fetch first) ») apres avoir builde pour rien.
#
# `cancel-in-progress: false` : chaque push doit publier sa propre version, a
# la queue leu leu — annuler le run en cours sauterait une publication.
concurrency:
  group: ios-publish
  cancel-in-progress: false

jobs:
  build:
    # `react-native-nitro-rtmp-publisher` (remplace @api.video/react-native-
    # livestream — voir GoLiveScreen.tsx) vendorise HaishinKit 2.2.5, qui
    # reference kVTCompressionPropertyKey_VariableBitRate derriere un
    # @available(iOS 26, ...) : ce symbole n'existe dans AUCUN SDK avant
    # iOS 26, donc ca ne compile qu'avec le SDK fourni par Xcode 26 —
    # meme si l'app cible reellement iOS 15.1 (deploymentTarget). C'est
    # l'inverse de l'ancienne contrainte de ce workflow (qui evitait Xcode 26
    # a cause d'un crash du compilateur Swift sur le HaishinKit 1.9.x de
    # l'ancienne lib) : cette lib-ci n'a plus ce probleme, donc `macos-latest`
    # convient. Si un futur bump d'une dependance replante sous Xcode 26,
    # verifier d'abord si c'est ce meme genre de plancher SDK avant de
    # chercher a repined une version anterieure d'Xcode.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Les domaines de l'API et du serveur de stream ne sont plus ecrits en
      # dur dans le code (voir src/config/api.ts et src/services/liveService.ts) —
      # le depot est public. `EXPO_PUBLIC_*` est inline par Metro au moment du
      # bundle JS, qui a lieu PENDANT `xcodebuild archive` (etape "Archive
      # unsigned" plus bas) : ce .env doit donc exister avant elle, peu importe
      # l'etape exacte tant que c'est fait a temps.
      - name: Configure les domaines (secrets du depot)
        env:
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          STREAM_SERVER: ${{ secrets.EXPO_PUBLIC_STREAM_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$STREAM_SERVER" ]; then
            echo "::error::EXPO_PUBLIC_API_URL et/ou EXPO_PUBLIC_STREAM_SERVER absents des secrets du depot (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_STREAM_SERVER=$STREAM_SERVER"
          } >> .env

          # Le `.env` seul ne suffit pas : la phase "Bundle React Native code"
          # de `xcodebuild archive` ne tourne pas forcement avec le repo en
          # working directory, donc le chargement dotenv d'Expo peut le
          # manquer silencieusement (BASE_URL retombe alors sur le fallback
          # hors ligne, sans erreur). $GITHUB_ENV propage ces variables telles
          # quelles dans process.env de TOUTES les etapes suivantes du job,
          # y compris celle-ci, quel que soit le repertoire courant.
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_STREAM_SERVER=$STREAM_SERVER"
          } >> "$GITHUB_ENV"

      # Le numero de build doit etre connu AVANT le bundling JS : c'est lui que
      # l'app compare ensuite au gist pour savoir qu'elle est perimee (voir
      # src/services/updateCheck.ts). On lit donc le gist maintenant, on calcule
      # le prochain numero, et c'est ce meme numero qui sera ecrit dans
      # apps.json a la toute fin — les deux valeurs doivent coincider, sinon
      # l'app fraichement publiee se croirait deja en retard sur elle-meme.
      #
      - name: Prepare la version publiee
        run: |
          set -uo pipefail
          GIST_ID="4d82d6b4a3adaef965765ab37937ef83"

          # Volontairement SANS `set -e` : cette etape est au mieux utile, jamais
          # bloquante. L'IPA est publie en artefact AVANT l'etape de gist, et un
          # jeton expire ou un gist momentanement injoignable ne doit pas priver
          # d'un build par ailleurs sain. Sans numero, la verification de mise a
          # jour se desactive d'elle-meme cote app (voir updateCheck.ts) ; c'est
          # l'etape finale de publication qui, elle, echouera bruyamment.
          #
          # L'URL brute plutot qu'un clone : le gist traine encore l'historique
          # des IPA publies avant que l'hebergement ne bascule sur le VPS, et
          # seul apps.json (1 Ko) nous interesse ici.
          if ! curl -sfL --max-time 30 -o published-apps.json \
               "https://gist.githubusercontent.com/gaslebossop/${GIST_ID}/raw/apps.json"; then
            echo "::warning::Gist injoignable — build sans estampille de version."
            exit 0
          fi

          CURRENT=$(python3 -c "import json;print(json.load(open('published-apps.json'))['apps'][0]['versions'][0]['buildVersion'])" || true)
          if ! [ "$CURRENT" -eq "$CURRENT" ] 2>/dev/null; then
            echo "::warning::buildVersion illisible dans le gist — build sans estampille."
            exit 0
          fi

          NEXT=$((CURRENT + 1))
          echo "buildVersion publiee : $CURRENT -> $NEXT"

          # L'API du gist plutot que l'URL brute : elle ne demande pas de
          # connaitre le compte proprietaire et fonctionne sur un gist secret.
          FEED_URL="https://api.github.com/gists/${GIST_ID}"

          {
            echo "EXPO_PUBLIC_BUILD_VERSION=$NEXT"
            echo "EXPO_PUBLIC_UPDATE_FEED_URL=$FEED_URL"
          } >> .env
          {
            echo "EXPO_PUBLIC_BUILD_VERSION=$NEXT"
            echo "EXPO_PUBLIC_UPDATE_FEED_URL=$FEED_URL"
          } >> "$GITHUB_ENV"

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selection de $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --legacy-peer-deps : l'arbre React 19 / RN 0.81 declenche un
      # ERESOLVE sur @react-native-community/datetimepicker sinon.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      # Etape explicite : `expo prebuild` ne lance pas toujours pod install
      # sur CI, et sans les Pods aucun .xcworkspace n'est genere.
      - name: Install pods
        working-directory: ios
        run: pod install

      # Le nom du workspace est derive du nom de l'app et non code en dur,
      # pour ne pas casser si celui-ci change. -derivedDataPath est
      # obligatoire : par defaut xcodebuild ecrit dans ~/Library/Developer
      # et l'upload ne trouverait rien a publier.
      # `archive` et non `build` : l'action archive execute la phase install
      # (strip, post-processing de deploiement) et produit l'app telle
      # qu'elle serait distribuee, dans Products/Applications. C'est la
      # recette validee manuellement sur la machine de dev.
      - name: Archive unsigned
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE — Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # Empaquetage sur macOS et non cote Windows : le zip de Windows ecrit
      # les chemins avec des antislashs, omet les entrees de repertoire et
      # perd les permissions Unix (bit executable du binaire). AltStore
      # rejette alors l'archive avec « invalid format ». `zip -y` preserve
      # en prime les liens symboliques des frameworks.
      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(ls -d build/*.xcarchive/Products/Applications/*.app | head -1)
          NAME=$(basename "$APP" .app)
          rm -rf Payload
          mkdir Payload
          cp -r "$APP" Payload/

          # Certains frameworks sortent de l'archive avec leur binaire en 0644
          # (constate sur React.framework et ReactNativeDependencies.framework,
          # alors que hermes.framework est bien en 0755) : le binaire Mach-O
          # d'un framework DOIT etre executable, sinon le bundle est invalide
          # et les outils de sideload rejettent l'IPA avec « Invalid file »
          # — alors meme que l'archive est par ailleurs parfaitement saine,
          # ce qui rend le symptome tres trompeur.
          find Payload -type f -exec sh -c '
            for f do
              magic=$(od -An -N4 -tx1 "$f" | tr -d " \n")
              case "$magic" in
                cffaedfe|cefaedfe|feedfacf|feedface|cafebabe) chmod +x "$f" ;;
              esac
            done
          ' sh {} +

          # Signature ad-hoc (identite « - ») : ne demande AUCUN certificat ni
          # profil Apple, mais produit le squelette _CodeSignature/CodeResources
          # dans l'app et dans chaque framework.
          #
          # C'est indispensable : les outils de sideload (Sideloadly, AltStore)
          # RE-signent une app, ils ne la signent pas depuis zero. Un bundle
          # totalement depourvu de _CodeSignature est rejete a l'installation
          # avec « Invalid file » — diagnostic trompeur, car l'archive est par
          # ailleurs valide (zip sain, Info.plist complet, Mach-O arm64/iOS).
          # Constate en comparant avec un build local signe qui, lui, passait.
          #
          # De l'interieur vers l'exterieur : signer l'app en dernier, sinon sa
          # signature ne couvrirait pas les frameworks re-signes apres elle.
          for fw in Payload/*.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none Payload/*.app
          codesign --verify --verbose Payload/*.app

          # -y : stocke les liens symboliques tels quels au lieu de les suivre
          # (les frameworks iOS sont plats aujourd'hui, mais un lien duplique
          # casserait la signature au moment du resign).
          zip -y -r "$NAME.ipa" Payload

          # Garde-fou : sans cette structure, l'IPA est inutilisable pour du
          # sideload — autant que le build echoue ici plutot qu'a l'install.
          if ! unzip -l "$NAME.ipa" | grep -q "_CodeSignature/CodeResources"; then
            echo "::error::IPA sans _CodeSignature — la signature ad-hoc a echoue."
            exit 1
          fi
          unzip -l "$NAME.ipa" | tail -3
          ls -lh "$NAME.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/*.ipa
          if-no-files-found: error

      # ── Publication ──────────────────────────────────────────────────────
      #
      # L'IPA vit sur le VPS, plus dans le gist. Pourquoi : le gist commitait
      # 27 Mo par version DANS SON HISTORIQUE. A la quinzieme, il pesait 97 Mo
      # et GitHub a ferme le robinet — « Repository is above its size quota »,
      # tout push rejete, y compris un force-push qui aurait fait maigrir le
      # depot. Plus aucune version ne pouvait etre publiee.
      #
      # Le gist reste le FLUX (apps.json + icon.png) : son identifiant ne
      # change pas, donc la source AltStore de chacun reste valable. Il n'est
      # plus ecrit par `git push` mais par l'API, qui n'est pas soumise au
      # quota — et 1 Ko de JSON par publication ne le fera plus grossir.
      - name: Publier l'IPA sur le VPS
        env:
          VPS_IPA_KEY: ${{ secrets.VPS_IPA_KEY }}
          VPS_IPA_HOST: ${{ secrets.VPS_IPA_HOST }}
          VPS_IPA_HOSTKEY: ${{ secrets.VPS_IPA_HOSTKEY }}
        run: |
          set -euo pipefail
          IPA=$(ls ios/*.ipa | head -1)

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_IPA_KEY" > ~/.ssh/ipa_key
          chmod 600 ~/.ssh/ipa_key
          # Cle d'hote epinglee : `accept-new` accepterait n'importe quel
          # serveur qui repondrait a cette adresse.
          printf '%s\n' "$VPS_IPA_HOSTKEY" >> ~/.ssh/known_hosts

          # La cle est confinee cote serveur par `command="..."` dans
          # authorized_keys (voir .github/scripts/receive-ipa.sh) : elle ne sait
          # QUE recevoir un IPA sur stdin. Rien a passer en argument, la commande
          # demandee ici serait de toute facon ignoree.
          OUT=$(ssh -i ~/.ssh/ipa_key -o BatchMode=yes "$VPS_IPA_HOST" < "$IPA")
          echo "$OUT"

          # Le serveur renvoie la taille reellement ecrite. C'est elle qui va
          # dans apps.json : AltStore l'affiche avant le telechargement, et un
          # chiffre faux se voit tout de suite.
          SIZE="${OUT#IPA_SIZE=}"
          if ! [ "$SIZE" -eq "$SIZE" ] 2>/dev/null; then
            echo "::error::Reponse inattendue du VPS : $OUT"
            exit 1
          fi
          echo "IPA_SIZE=$SIZE" >> "$GITHUB_ENV"

      # buildVersion est ce qu'AltStore compare pour detecter une nouvelle
      # version — il DOIT augmenter a chaque fois, "version" reste un simple
      # libelle humain.
      - name: Mettre a jour la source AltStore
        env:
          GIST_PUSH_TOKEN: ${{ secrets.GIST_PUSH_TOKEN }}
          VPS_IPA_URL: ${{ secrets.VPS_IPA_URL }}
        run: |
          set -euo pipefail
          GIST_ID="4d82d6b4a3adaef965765ab37937ef83"

          # Relecture juste avant d'ecrire : le numero calcule au debut du job
          # date de ~15 minutes. Si un autre run a publie entre-temps, le
          # garde-fou de update_gist.py le verra (numero <= deja publie).
          curl -sfL --max-time 30 -o apps.json \
            "https://gist.githubusercontent.com/gaslebossop/${GIST_ID}/raw/apps.json"

          # On republie le numero grave dans le bundle, pour que les deux
          # coincident. S'il manque (estampillage renonce plus haut), on retombe
          # sur un simple increment : l'IPA est alors publie sans savoir se
          # comparer au flux, mais AltStore, lui, voit bien la nouvelle version.
          BUILD_VERSION="${EXPO_PUBLIC_BUILD_VERSION:-}"
          if [ -z "$BUILD_VERSION" ]; then
            CURRENT=$(python3 -c "import json;print(json.load(open('apps.json'))['apps'][0]['versions'][0]['buildVersion'])")
            BUILD_VERSION=$((CURRENT + 1))
            echo "::warning::IPA non estampille — buildVersion incrementee a $BUILD_VERSION sans correspondance dans le bundle."
          fi

          python3 .github/scripts/update_gist.py apps.json "$BUILD_VERSION" "$IPA_SIZE" "$VPS_IPA_URL"

          python3 - <<'PY' > payload.json
          import json
          print(json.dumps({"files": {"apps.json": {"content": open("apps.json").read()}}}))
          PY

          # L'API, pas `git push` : le gist est au-dessus de son quota de taille
          # a cause des IPA d'avant, et tout push y est refuse. L'API passe.
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${GIST_PUSH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            --data @payload.json \
            "https://api.github.com/gists/${GIST_ID}" > /dev/null

          echo "Source AltStore mise a jour : buildVersion $BUILD_VERSION, $IPA_SIZE octets."
