name: Publish Android to G-Store

# Construit l'APK Android SIGNE avec la cle de release, le publie dans le
# catalogue G-Store, et previent les appareils.
#
# ── Ce qui differe de android-build.yml ──────────────────────────────────────
# `android-build.yml` produit un artefact de TEST signe avec le keystore de
# debug — regenere a chaque run, donc une signature differente a chaque fois,
# donc aucune mise a jour possible. Ce workflow-ci signe avec la cle
# permanente, sans quoi Android refuse de voir la nouvelle version comme une
# mise a jour de la precedente.
#
# ── Ce qui ne transite PAS par la CI ─────────────────────────────────────────
# La cle Firebase reste sur le VPS. La cle SSH utilisee ici est forcee sur une
# seule commande dans authorized_keys (voir .github/scripts/receive-apk.sh) :
# elle ne peut ni ouvrir un shell, ni lire un fichier, ni publier un paquet
# hors liste blanche. C'est ce qui permet de la garder dans les secrets d'un
# depot PUBLIC.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Note de version affichee dans le store et la notification"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure les domaines (secrets du depot)
        env:
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          STREAM_SERVER: ${{ secrets.EXPO_PUBLIC_STREAM_SERVER }}
          MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$STREAM_SERVER" ]; then
            echo "::error::EXPO_PUBLIC_API_URL et/ou EXPO_PUBLIC_STREAM_SERVER absents des secrets du depot."
            exit 1
          fi
          # `if` et non `[ -n ... ] && echo` : sous `set -e`, un test faux en
          # DERNIERE instruction du bloc fait echouer l'etape entiere. C'est
          # exactement ce qui s'est passe au premier run, cle Maps absente.
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_STREAM_SERVER=$STREAM_SERVER"
            if [ -n "$MAPS_KEY" ]; then
              echo "EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY=$MAPS_KEY"
            fi
          } >> .env

      # Meme compteur que iOS : le `buildVersion` du gist AltStore fait
      # autorite pour les deux plateformes. On l'ESTAMPILLE sans l'incrementer
      # — c'est la publication iOS qui le fait avancer.
      # ── Le compteur ANDROID, et lui seul ────────────────────────────────
      #
      # Avant, on estampillait le `buildVersion` du gist — le compteur iOS.
      # Mais seule la CI iOS l'incremente : deux publications Android entre
      # deux sorties iOS portaient le meme numero, et le serveur refusait la
      # seconde (« versionCode deja publie »). Les deux plateformes n'ont
      # aucune raison de partager un compteur : chacune a son flux.
      #
      # Le numero Android vient donc du catalogue G-Store, qui est justement ce
      # que ce workflow met a jour : dernier publie + 1. Impossible de
      # desynchroniser, impossible de reculer.
      - name: Numero de build (compteur du catalogue G-Store)
        run: |
          set -euo pipefail
          CATALOG="https://twitninf.duckdns.org/static/gstore/catalog.json"
          PACKAGE="com.gasleboss.TwitNin"

          CURRENT=$(curl -sS -m 20 "$CATALOG"             | python3 -c "import json,sys;print(next((a.get('versionCode',0) for a in json.load(sys.stdin).get('apps',[]) if a.get('packageName')=='$PACKAGE'), 0))"             || echo 0)

          NEXT=$((CURRENT + 1))
          echo "catalogue : $CURRENT -> nouvelle version : $NEXT"

          # `EXPO_PUBLIC_UPDATE_FEED_URL` reste le gist : c'est l'adresse que
          # l'app iOS interroge. Cote Android, `updateCheck.ts` lit le
          # catalogue directement, sans passer par cette variable.
          {
            echo "EXPO_PUBLIC_BUILD_VERSION=$NEXT"
            echo "EXPO_PUBLIC_UPDATE_FEED_URL=https://api.github.com/gists/4d82d6b4a3adaef965765ab37937ef83"
          } >> .env
          echo "EXPO_PUBLIC_BUILD_VERSION=$NEXT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle


      # ── Ce qui evite de tout recompiler a chaque run ─────────────────────
      #
      # Le poste de depense, c'est la compilation native C++ (CMake, un
      # passage par architecture). Elle repartait de zero a chaque fois parce
      # que `prebuild --clean` supprime `android/` — donc aussi
      # `android/app/.cxx`, ou CMake garde ses objets compiles.
      #
      # On garde donc `android/` et `node_modules` entre les runs. La cle
      # inclut l'empreinte de tout ce qui change la generation native
      # (dependances, config Expo, config plugins) : une modification de l'un
      # d'eux invalide le cache et force une regeneration propre.
      - name: Cache du dossier natif et des dependances
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            android
            node_modules
          key: android-native-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**') }}-${{ github.run_id }}
          restore-keys: |
            android-native-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**') }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Le keystore arrive en base64 : un fichier binaire ne se met pas tel
      # quel dans un secret GitHub.
      - name: Restaure la cle de release
        env:
          KEYSTORE_B64: ${{ secrets.TWITNINF_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TWITNINF_KEYSTORE_B64 absent. Sans cle permanente, l'APK produit ne peut pas mettre a jour les installations existantes."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "TWITNINF_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # Le plugin `withReleaseSigning` lit ces variables AU PREBUILD : elles
      # doivent etre posees avant, pas seulement avant Gradle.
      - name: Prebuild Android (avec la config de signature)
        env:
          TWITNINF_KEYSTORE_PASSWORD: ${{ secrets.TWITNINF_KEYSTORE_PASSWORD }}
          TWITNINF_KEY_ALIAS: ${{ secrets.TWITNINF_KEY_ALIAS }}
          TWITNINF_KEY_PASSWORD: ${{ secrets.TWITNINF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # `--clean` UNIQUEMENT sans cache : il supprime android/ en entier, y
          # compris les objets natifs deja compiles. En incremental, les mods
          # du plugin de signature se reappliquent sans dommage (il verifie
          # avant d'ecrire).
          if [ -d android/app ]; then
            echo "dossier natif restaure : prebuild incremental"
            npx expo prebuild --platform android
          else
            npx expo prebuild --platform android --clean
          fi
          grep -q "signingConfigs.release" android/app/build.gradle || {
            echo "::error::le buildType release pointe encore sur la cle de debug."
            exit 1
          }

      - name: Build APK release
        working-directory: android
        run: |
          # Le bit executable de gradlew ne survit pas a la restauration du
          # cache du dossier natif : sans ce chmod, le build s'arrete sur
          # « ./gradlew: Permission denied » (code 126).
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --no-parallel --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.lint.checkReleaseBuilds=false

      - name: Lis la version DANS l'APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"

          AAPT=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")

          # Lu dans le fichier, jamais recopie a la main : une metadonnee
          # saisie deux fois finit toujours par diverger.
          PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$BADGING" | head -1)
          NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "APK_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "$PACKAGE $NAME (code $CODE), $(du -h "$APK" | cut -f1)"

      - name: Verifie la signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256 digest" | head -1

      - name: Publie dans G-Store et previent les appareils
        env:
          VPS_APK_KEY: ${{ secrets.VPS_APK_KEY }}
          VPS_APK_HOST: ${{ secrets.VPS_APK_HOST }}
          VPS_APK_HOSTKEY: ${{ secrets.VPS_APK_HOSTKEY }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_APK_KEY" > ~/.ssh/apk_key
          chmod 600 ~/.ssh/apk_key
          printf '%s\n' "$VPS_APK_HOSTKEY" >> ~/.ssh/known_hosts

          # La cle est forcee sur receive-apk.sh cote serveur : cette chaine
          # arrive en $SSH_ORIGINAL_COMMAND, elle ne peut pas etre executee.
          OUT=$(ssh -i ~/.ssh/apk_key -o BatchMode=yes "$VPS_APK_HOST" \
            "$APK_PACKAGE $APK_CODE $APK_NAME $NOTES" < "$APK_PATH")
          echo "$OUT"

          echo "$OUT" | grep -q "APK_URL=" || {
            echo "::error::publication refusee par le serveur."
            exit 1
          }

          {
            echo "### Publie dans G-Store"
            echo ""
            echo "- \`$APK_PACKAGE\` $APK_NAME (build $APK_CODE)"
            echo "$OUT" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: twitninf-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
