name: Build Android APK

# Build un APK Android sur un runner Linux GitHub-hoste — beaucoup plus
# rapide qu'un build EAS cloud (pas de file d'attente partagee) et sans
# dependance a un service tiers.
#
# `release` est signe avec le keystore de debug (voir android/app/build.gradle
# — signingConfigs.release pointe encore sur signingConfigs.debug, aucun
# vrai keystore de prod n'est configure), donc l'APK produit s'installe
# directement sur un appareil sans etape de signature supplementaire,
# contrairement a l'IPA iOS (voir ios-build.yml) qui doit passer par
# Sideloadly.
on: [workflow_dispatch]

jobs:
  build:
    # Runner standard par defaut. Si ce repo/org a des runners GitHub plus
    # gros de provisionnes (Team/Enterprise), remplacer par leur label
    # (ex. `ubuntu-latest-8-cores`) — sinon le job echoue faute de runner
    # disponible sous ce nom.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Meme convention que ios-build.yml : les domaines de l'API/stream ne
      # sont pas ecrits en dur (voir src/config/api.ts, src/services/liveService.ts)
      # — le depot est public. `EXPO_PUBLIC_*` est inline par Metro pendant le
      # bundling JS, qui a lieu pendant `gradlew assembleRelease` : ce .env
      # doit donc exister avant.
      - name: Configure les domaines (secrets du depot)
        env:
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          STREAM_SERVER: ${{ secrets.EXPO_PUBLIC_STREAM_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$STREAM_SERVER" ]; then
            echo "::error::EXPO_PUBLIC_API_URL et/ou EXPO_PUBLIC_STREAM_SERVER absents des secrets du depot (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_STREAM_SERVER=$STREAM_SERVER"
          } >> .env
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_STREAM_SERVER=$STREAM_SERVER"
          } >> "$GITHUB_ENV"

      # Meme flux de versions que sur iOS (voir src/services/updateCheck.ts),
      # mais l'APK ne PUBLIE rien dans le gist : c'est le Kospor Store qui le
      # distribue. On estampille donc ce build avec le numero DEJA publie, sans
      # l'incrementer — sinon un APK fraichement construit se declarerait
      # perime des son premier lancement.
      #
      # Lecture anonyme : un gist secret reste lisible par l'API a qui connait
      # son identifiant, et ce job n'a pas besoin d'y ecrire.
      - name: Recupere la version publiee
        run: |
          set -euo pipefail
          GIST_ID="4d82d6b4a3adaef965765ab37937ef83"
          FEED_URL="https://api.github.com/gists/${GIST_ID}"

          BUILD_VERSION=$(curl -sS -m 20 -H "Accept: application/json" "$FEED_URL" \
            | python3 -c "import json,sys;print(json.loads(json.load(sys.stdin)['files']['apps.json']['content'])['apps'][0]['versions'][0]['buildVersion'])")

          if [ -z "$BUILD_VERSION" ]; then
            echo "::error::buildVersion introuvable dans le gist $GIST_ID."
            exit 1
          fi
          echo "buildVersion estampillee : $BUILD_VERSION"

          {
            echo "EXPO_PUBLIC_BUILD_VERSION=$BUILD_VERSION"
            echo "EXPO_PUBLIC_UPDATE_FEED_URL=$FEED_URL"
          } >> .env
          {
            echo "EXPO_PUBLIC_BUILD_VERSION=$BUILD_VERSION"
            echo "EXPO_PUBLIC_UPDATE_FEED_URL=$FEED_URL"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Met en cache ~/.gradle/caches et le wrapper entre les runs —
          # c'est le plus gros gain de vitesse disponible sans runner plus
          # gros (le premier build reste lent, les suivants beaucoup moins).
          cache: gradle

      # --legacy-peer-deps : meme ERESOLVE React 19 / RN 0.81 que sur iOS
      # (voir ios-build.yml) sur @react-native-community/datetimepicker.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      # Lint (lintVitalAnalyzeRelease) desactive : sur un run precedent, des
      # taches de lint ont plante vers un avertissement memoire JVM
      # (Metaspace) puis Gradle est reste bloque de longues minutes sans plus
      # rien logger. Cet APK est un artefact de test signe debug, pas un
      # envoi Play Store : le lint n'apporte rien ici.
      #
      # --no-parallel : android/gradle.properties fixe `org.gradle.parallel=
      # true` en dur (pour les builds locaux, plus rapides sur une machine de
      # dev) — sans l'annuler ici, retirer juste `--parallel` de la ligne de
      # commande ne changeait rien. Avec des dizaines de modules (un par lib
      # Expo) compilant en parallele, chacun dans son propre JVM a 2 Go de
      # heap, ca depasse largement les 7 Go du runner standard — d'ou les
      # `OutOfMemoryError: Metaspace` en rafale. --no-daemon evite en plus de
      # garder un daemon en memoire pour rien (le runner est jete apres).
      # -Dorg.gradle.jvmargs override la valeur de gradle.properties (2g/512m)
      # juste pour ce run CI, sans toucher au fichier partage avec les builds
      # locaux : un seul JVM a la fois peut se permettre plus de marge.
      - name: Build APK release
        working-directory: android
        run: |
          ./gradlew assembleRelease --build-cache --no-parallel --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.lint.checkReleaseBuilds=false

      - name: Localiser l'APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
